{% extends "base.html" %}
{% load i18n %}

{% block title %}Terminer l'inscription | Piolo{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; background-color: #F7F5F1; padding: 20px;">
  <div style="background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); text-align: center; max-width: 480px; width: 100%;">
    
    <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(212, 175, 55, 0.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px auto; color: #D4AF37;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>

    <h1 style="font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 800; color: #0F0D09; margin-bottom: 16px;">
      Terminer l'inscription
    </h1>

    <p style="font-family: 'DM Sans', sans-serif; font-size: 15px; color: #64605A; margin-bottom: 32px; line-height: 1.6;">
      Vous y êtes presque ! Complétez les informations manquantes pour finaliser votre compte Piolo.
    </p>

    <form method="post" style="text-align: left;">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" style="display: block; width: 100%; padding: 14px; background-color: #0F0D09; color: white; border: none; border-radius: 12px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s; margin-top: 24px;">
        Finaliser l'inscription
      </button>
    </form>

  </div>
</div>
{% endblock %}
